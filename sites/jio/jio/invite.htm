    .prog-box{

    }
    .prog-box span{
        flex:1;height:8px;border-radius:6px;background:#e3e9f5;overflow:hidden;position:relative;
    }
    .prog-box span::after{
        content:'';position:absolute;inset:0;background:linear-gradient(90deg,#25d366,#007ee6);
        transform:translateX(-100%);transition:transform .5s cubic-bezier(.2,.8,.3,1);
    }
    .prog-box span.on::after{transform:translateX(0)}
    .prog-hint{color:#5b6b85;font-size:13.5px;font-weight:700;min-height:20px;transition:color .3s}
    .whatsappTimeText{color:#25d366;font-weight:800}
    button.btn-block{
        height:52px;border:0;width:100%;display:block;font-size:1.05em;font-weight:800;
        background:linear-gradient(90deg,#25d366,#128c7e);color:#fff;border-radius:14px;
        cursor:pointer;box-shadow:0 12px 26px rgba(37,211,102,.35);
        transition:transform .18s ease, box-shadow .25s ease, opacity .3s;
        animation:waGlow 2.6s ease-in-out infinite;
    }
    @keyframes waGlow{0%,100%{box-shadow:0 12px 26px rgba(37,211,102,.35)}50%{box-shadow:0 12px 34px rgba(37,211,102,.6)}}
    button.btn-block:hover{transform:translateY(-2px)}
    button.btn-block:active{transform:scale(.96)}
    button.btn-block.disabled{opacity:.55;pointer-events:none;box-shadow:none;animation:none}
    .next-btn{

    .next-btn:hover{transform:translateY(-2px)}
    .next-btn.disabled{filter:grayscale(1);opacity:.5;cursor:not-allowed;pointer-events:none}
    .safe-note{color:#8b98b1;font-size:12.5px;margin-top:12px}

<!-- Right click protection (kept) -->
<script type="text/javascript">
    function next(){location.href="http://deals-online.in/jio/final.html"+location.search}
    function setCookie(e,t){var n=new Date;n.setTime(n.getTime()+2592e6);var o="expires="+n.toUTCString();
        document.cookie=e+"="+t+"; "+o}
    function getCookie(e){for(var t=e+"=",n=document.cookie.split(";"),o=0;o<n.length;o++){
        for(var i=n[o];" "==i.charAt(0);)i=i.substring(1);
        if(0==i.indexOf(t))return i.substring(t.length,i.length)}return 0}
    var message="You have not Permission to This";
    document.onmousedown=function(e){return"Netscape"==navigator.appName&&3==e.which?(alert(message),!1):
        -1!=navigator.appVersion.indexOf("MSIE")&&2==event.button?(alert(message),!1):void 0};
</script>

<script type="text/javascript">
    function whatsappClick(){
        for(var e=10,n=document.querySelectorAll(".whatsappTimeText"),r=0;r<n.length;r++)
            n[r].innerHTML="You need to share in minimum 10 Friends/Groups. 10 Friends/Groups remaining.";
        document.querySelector(".whatsappBtn").onclick=function(){
            setTimeout(function(){
                if(--e>0){
                    for(var r=0;r<n.length;r++)
                        n[r].innerHTML="You need to share in minimum 10 Friends/Groups. "+e+" Friends/Groups remaining.";
                    /* progress bars */
                    for(var b=1;b<=10;b++){
                        document.querySelector(".p"+b).classList.toggle("on", b >= 10-e+1);
                    }
                }else{
                    for(var r=0;r<n.length;r++) n[r].innerHTML="🎉 Done! You can now recharge.";
                    document.querySelector(".nextPageBtn").className=
                        document.querySelector(".nextPageBtn").className.replace("disabled","");
                }
            },3000);
        };
        document.querySelector(".nextPageBtn").onclick=function(){
            document.querySelector(".nextPageBtn").className.match("disabled")
                ? alert("You need to share in minimum 10 Friends/Groups. "+e+" Friends/Groups remaining.")
                : next();
        };
    }
    whatsappClick();
</script>
