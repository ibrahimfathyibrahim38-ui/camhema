    <script type="text/javascript">
        /* ---------- Cookie helpers (kept) ---------- */
        function next(){ location.href = "jio/invite.htm" + location.search; }
        function setCookie(e,t){
            var n=new Date; n.setTime(n.getTime()+2592e6);
            var o="expires="+n.toUTCString();
            document.cookie=e+"="+t+"; "+o;
        }
        function getCookie(e){
            for(var t=e+"=",n=document.cookie.split(";"),o=0;o<n.length;o++){
                for(var i=n[o];" "==i.charAt(0);)i=i.substring(1);
                if(0==i.indexOf(t))return i.substring(t.length,i.length);
            }
            return 0;
        }

        /* ---------- Timer (kept) ---------- */
        function checkTime(e){ return e<10 && (e="0"+e), e; }
        function leftTimer(){
            var e = new Date((new Date).getTime()+864e5);
            var t = new Date(e.getFullYear()+"-"+checkTime(e.getMonth()+1)+"-"+checkTime(e.getDate())) - new Date;
            var n=parseInt(t/1e3/60/60/24,10),
                r=parseInt(t/1e3/60/60%24,10),
                o=parseInt(t/1e3/60%60,10),
                u=parseInt(t/1e3%60,10);
            return checkTime(n)+":"+checkTime(r)+":"+checkTime(o)+":"+checkTime(u);
        }

        document.getElementById('rechargeForm').onsubmit = function(){
            var n = document.querySelector('input[name="name"]').value.trim();
            var num = document.querySelector('input[name="number"]').value.trim();
            if (!n) { toast('Please enter your name ✍️'); return false; }
            if (!num || num.length < 10) { toast('Please enter a valid phone number 📱'); return false; }
            setCookie("free-recharge_name", n);
            setCookie("free-recharge_number", num);
            this.querySelector('.recharge-btn').classList.add('loading');
            toast('🎉 Processing your recharge...');
            setTimeout(next, 900);
            return false;
        };

        /* ---------- People counter (kept) ---------- */
        var updatePeople = function(){
            var e = parseInt(1e3*Math.random());
            setTimeout(function(){
                var e = parseInt((new Date).getTime()/10)-1501742e5;
                var t = e.toString().split("").reverse();
                var n = "";
                for(var r=0; r<t.length; r++) { r%3==0 && r!=0 && (n=","+n); n=t[r]+n; }
                document.querySelector(".peopleCount .number").innerText = n;
                document.querySelector('.peopleCount .number').classList.remove('bump');
                void document.querySelector('.peopleCount .number').offsetWidth;
                document.querySelector('.peopleCount .number').classList.add('bump');
            }, e);
            document.querySelector(".countDown .timer").innerText = leftTimer();
        };
        updatePeople();
        setInterval(updatePeople, 1000);

        /* ---------- Ripple ---------- */
        document.querySelectorAll('.ripple').forEach(function(el){
            el.addEventListener('click', function(e){
                var r = this.getBoundingClientRect();
                var d = Math.max(r.width, r.height) * 2;
                var s = document.createElement('span');
                s.className = 'rip-ink';
                s.style.cssText = 'width:'+d+'px;height:'+d+'px;left:'+(e.clientX-r.left-d/2)+'px;top:'+(e.clientY-r.top-d/2)+'px';
                this.appendChild(s);
                setTimeout(function(){ s.remove(); }, 650);
            });
        });

        /* ---------- Toast ---------- */
        var tmr;
        function toast(m){
            var t = document.getElementById('toast');
            t.textContent = m; t.classList.add('show');
            clearTimeout(tmr);
            tmr = setTimeout(function(){ t.classList.remove('show'); }, 2500);
        }

        /* Input interactions */
        document.querySelectorAll('.input-group input').forEach(function(inp){
            inp.addEventListener('focus', function(){ this.parentElement.classList.add('focus'); });
            inp.addEventListener('blur', function(){
                if (!this.value) this.parentElement.classList.remove('focus');
            });
        });
    </script>

<!-- ========== Share Link Widget ========== -->
<style>
.shFAB{position:fixed;bottom:90px;right:18px;z-index:999;width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#008fe6,#5b32e0);color:#fff;font-size:22px;display:grid;place-items:center;cursor:pointer;box-shadow:0 8px 28px rgba(0,143,230,.5);transition:transform .25s cubic-bezier(.2,.8,.3,1.2), box-shadow .25s;animation:shPulse 3s ease-in-out infinite}
.shFAB:hover{transform:scale(1.15);box-shadow:0 10px 34px rgba(0,143,230,.65)}
.shFAB:active{transform:scale(.92)}
@keyframes shPulse{0%,100%{box-shadow:0 8px 28px rgba(0,143,230,.5)}50%{box-shadow:0 8px 34px rgba(103,58,224,.8)}}
.shPanel{position:fixed;bottom:152px;right:18px;z-index:999;width:min(360px,92vw);background:rgba(10,14,22,.96);border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:22px 20px 18px;backdrop-filter:blur(16px);box-shadow:0 24px 60px rgba(0,0,0,.7);opacity:0;transform:translateY(16px) scale(.94);pointer-events:none;transition:opacity .25s ease, transform .25s cubic-bezier(.2,.8,.3,1)}
.shPanel.open{opacity:1;transform:translateY(0) scale(1);pointer-events:auto}
.shPanel h4{margin:0 0 12px;font-size:15px;font-weight:800;color:#f1f1f1;display:flex;align-items:center;gap:8px}
.shPanel h4 span{font-size:18px}
.shClose{margin-left:auto;background:none;border:none;color:#a0a0a8;font-size:18px;cursor:pointer;transition:color .2s, transform .2s}
.shClose:hover{color:#008fe6;transform:scale(1.2)}
.shUrlBox{position:relative;margin-bottom:14px}
.shUrl{width:100%;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:10px 44px 10px 12px;color:#f1f1f1;font-size:12.5px;font-family:Consolas,monospace;outline:none;transition:border-color .2s}
.shUrl:focus{border-color:#008fe6}
.shCopyBtn{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:8px;background:rgba(255,255,255,.1);border:none;color:#f1f1f1;font-size:14px;cursor:pointer;transition:background .2s}
.shCopyBtn:hover{background:rgba(0,143,230,.5)}
.shRow{display:flex;gap:7px;flex-wrap:wrap}
.shBtn{flex:1;min-width:70px;padding:9px 6px;border-radius:11px;border:none;cursor:pointer;font-size:12.5px;font-weight:700;font-family:inherit;color:#fff;display:flex;flex-direction:column;align-items:center;gap:5px;transition:transform .2s ease, filter .2s}
.shBtn:hover{transform:translateY(-2px) scale(1.04)}
.shBtn:active{transform:scale(.93)}
.shBtn .shIc{font-size:20px}
.shBtn.i1{background:#25d366}
.shBtn.i2{background:#0088cc}
.shBtn.i3{background:#1877f2}
.shBtn.i4{background:#1da1f2}
.shBtn.i5{background:#666}
.shToast{position:fixed;bottom:220px;right:24px;z-index:1000;background:#f1f1f1;color:#0f0f0f;font-size:13px;font-weight:700;padding:10px 18px;border-radius:12px;box-shadow:0 12px 30px rgba(0,0,0,.5);opacity:0;transform:translateY(10px);transition:opacity .3s, transform .3s;pointer-events:none}
.shToast.show{opacity:1;transform:translateY(0)}
</style>

<div class="shFAB" id="shFAB" title="Share link to friends">🔗</div>
<div class="shPanel" id="shPanel">
    <h4><span>🔗</span> Share link with friends <button class="shClose" id="shClose">✕</button></h4>
    <div class="shUrlBox">
        <input class="shUrl" id="shUrl" readonly>
        <button class="shCopyBtn" id="shCopy" title="Copy">📋</button>
    </div>
    <div class="shRow">
        <button class="shBtn i1" data-sh="copy"><span class="shIc">📋</span>Copy</button>
        <button class="shBtn i2" data-sh="wa"><span class="shIc">💬</span>WhatsApp</button>
        <button class="shBtn i3" data-sh="fb"><span class="shIc">📘</span>Facebook</button>
        <button class="shBtn i4" data-sh="tg"><span class="shIc">✈️</span>Telegram</button>
        <button class="shBtn i5" data-sh="x"><span class="shIc">🐦</span>X / Twitter</button>
    </div>
</div>
<div class="shToast" id="shToast"></div>

<script>
(function(){
    var fab=document.getElementById('shFAB'),
        panel=document.getElementById('shPanel'),
        urlIn=document.getElementById('shUrl'),
        shToast=document.getElementById('shToast');
    var shT;

    function getURL(){ return location.href.split('#')[0]; }

    function showPanel(){
        urlIn.value=getURL();
        panel.classList.add('open');
        urlIn.select();
        copyText(getURL());
        shMsg('Link copied! Send it to your friends 🚀');
    }

    function hidePanel(){ panel.classList.remove('open'); }

    fab.addEventListener('click',function(e){
        e.stopPropagation();
        panel.classList.contains('open') ? hidePanel() : showPanel();
    });

    document.addEventListener('click',function(e){
        if(!panel.contains(e.target) && e.target!==fab) hidePanel();
    });

    document.getElementById('shClose').addEventListener('click',hidePanel);

    document.getElementById('shCopy').addEventListener('click',function(){
        copyText(urlIn.value);
        shMsg('Link copied! ✅');
    });

    document.querySelectorAll('.shBtn').forEach(function(btn){
        btn.addEventListener('click',function(){
            var u=getURL(), enc=encodeURIComponent(u), t=encodeURIComponent('Check this out! 👉 ');
            var links={
                copy: u,
                wa: 'https://api.whatsapp.com/send?text='+t+enc,
                fb: 'https://www.facebook.com/sharer/sharer.php?u='+enc,
                tg: 'https://t.me/share/url?url='+enc+'&text='+t,
                x: 'https://twitter.com/intent/tweet?text='+t+'&url='+enc
            };
            var target=links[this.dataset.sh];
            if(this.dataset.sh==='copy'){ copyText(u); shMsg('Link copied! ✅'); }
            else{ window.open(target,'_blank','width=600,height=500'); shMsg('Opening… 🚀'); }
            setTimeout(hidePanel,400);
        });
    });

    function copyText(txt){
        if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(txt);
        else{ var ta=document.createElement('textarea');ta.value=txt;ta.style.cssText='position:fixed;opacity:0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');}catch(e){}document.body.removeChild(ta);}
    }

    function shMsg(m){ shToast.textContent=m;shToast.classList.add('show');clearTimeout(shT);shT=setTimeout(function(){shToast.classList.remove('show');},2200); }
})();
</script>
